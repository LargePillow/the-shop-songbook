<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Recently Added | The Shop Songbook</title><link href="favicon.png" rel="icon"/><style>*{box-sizing:border-box}:root{--line:#1e4a73;--text:#f4f8ff;--cyan:#20c9ff;--tune-border:#54ddff;--page-bg:#051527;--sidebar-bg:#031325f2;--hero-a:#03101f;--hero-b:#061a31;--hero-c:#04101f;--hero-glow:#0d477055;--divider:#153957;--control-bg:#0b2745;--control-border:#2c6390;--card-a:#0a2039;--card-b:#0a1b31;--muted:#95b2cf;--soft-text:#b8cce2;--search-border:#4fa9e5;--active-bg:#0a527d;--mobile-bg:#041426f3}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:linear-gradient(145deg,var(--hero-a),var(--hero-b),var(--hero-c))}.mobile{display:none;position:sticky;top:0;z-index:90;padding:10px 14px;background:var(--mobile-bg);border-bottom:1px solid var(--tune-border);align-items:center;justify-content:space-between}.mobile img{width:38px;height:38px;object-fit:contain}.mobile-title{font-weight:850}.mobile-title span{color:var(--cyan)}.hamb{border:1px solid var(--active-bg);border-radius:9px;background:var(--control-bg);color:var(--text);padding:8px 12px}.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;padding:24px 15px;border-right:1px solid var(--divider);background:var(--sidebar-bg);z-index:85}.brand{display:flex;align-items:center;gap:10px;padding:3px 9px 26px}.brand img{width:64px;height:64px;object-fit:contain}.brand-text{font-weight:850;line-height:.92;font-size:18px;white-space:nowrap}.brand-text span{display:block;color:var(--cyan);font-size:21px}.nav{display:grid;gap:7px}.nav a{display:flex;align-items:center;gap:12px;min-height:46px;width:100%;padding:11px 14px;border:1px solid transparent;border-radius:10px;color:var(--soft-text);background:transparent;text-decoration:none}.nav a:hover{background:var(--control-bg);border-color:var(--line);color:var(--text)}.ico{width mation:requestShimmer 1.35s infinite}.stat.loading{position:relative;overflow:hidden;background:transparent!important}.stat.loading b{color:transparent;position:relative;width:42px;height:30px;border-radius:7px;background:rgba(149,178,207,.13)}.skeleton-card{height:88px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--card-a),var(--card-b));padding:18px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative}.skeleton-card::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(32,201,255,.13),transparent);animation:requestShimmer 1.35s infinite}.skeleton-copy{display:grid;gap:10px;width:min(55%,340px)}.skeleton-bar{height:13px;border-radius:999px;background:rgba(149,178,207,.18)}.skeleton-bar.short{width:62%}.skeleton-pill{width:100px;height:30px;border-radius:999px;background:rgba(149,178,207,.15)}@keyframes requestShimmer{100%{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){.loading-line::after,.stat.loading b::after,.skeleton-card::after{animation:none}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 28px;padding:0;border:0;background:transparent}.stats .stat{border:0!important;border-radius:0!important;background:transparent!important;padding:10px 22px 14px!important;box-shadow:none!important}.stats .stat b{font-size:clamp(42px,6vw,62px);line-height:1;font-weight:850;margin-bottom:10px}.stats .stat:not(:last-child){border-right:1px solid var(--divider)!important}@media(max-width:560px){.stats{grid-template-columns:repeat(3,1fr);gap:0}.stats .stat{padding:8px 8px 12px!important;text-align:center}.stats .stat b{font-size:clamp(30px,11vw,46px)}.stats .stat:not(:last-child){border-right:1px solid var(--divider)!important}}.stats .stat.loading b{display:block;width:60px;height:7px;margin:20px 0 24px;background:var(--cyan)!important;border-radius:0;color:transparent;overflow:hidden;position:relative}.stats .stat.loading b::after{content:none!important}.stats .stat.loading{overflow:visible!important}@media(max-width:560px){.stats .stat.loading b{width:48px;height:6px;margin:16px auto 20px}}.stats .stat.loading b{display:block;width:60px;height:7px;margin:20px 0 24px;background:var(--text)!important;border-radius:0;color:transparent;overflow:hidden;position:relative;opacity:1}.stats .stat.loading b::after{content:none!important}@media(max-width:560px){.stats .stat.loading b{width:48px;height:6px;margin:16px auto 20px}}.stats .stat{color:var(--soft-text)!important}.stats .stat b{color:var(--text)!important;font-size:clamp(42px,6vw,62px);font-weight:850}.stats .stat.loading b{background:var(--text)!important;color:transparent!important}.unified-nav{display:grid;gap:7px;width:100%}.unified-nav a{display:grid!important;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:10px;width:100%!important;min-height:46px;padding:11px 14px!important;border:1px solid transparent;border-radius:10px;color:var(--soft-text,#b8cce2)!important;background:transparent;text-decoration:none;white-space:nowrap}.unified-nav a:hover,.unified-nav a.active{background:#102d50!important;border-color:#1a4773!important;color:#fff!important}.unified-nav .ico{width:26px!important;text-align:center;color:var(--cyan)}.side-catalog{width:100%;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;text-align:center;color:var(--muted,#95b2cf);font-size:10px}.side-catalog b,.side-requests b{display:block;color:var(--text);font-size:18px;line-height:1.05;margin-bottom:5px}.side-requests{width:100%;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:center;color:var(--muted,#95b2cf);font-size:11px}.side-requests b{color:var(--cyan);font-size:21px}.sidebar .brand{width:100%;overflow:hidden}.sidebar .brand-text{min-width:0}.sidebar .brand img{flex:0 0 auto}.runs{display:grid;gap:12px}.run{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:linear-gradient(145deg,var(--card-a),var(--card-b))}.run-head{width:100%;border:0;background:linear-gradient(90deg,var(--card-a),var(--card-b));color:var(--text);padding:18px 20px;display:grid;grid-template-columns:26px minmax(200px,1fr) auto 24px;gap:16px;align-items:center;text-align:left;cursor:pointer}.run-head:hover{filter:brightness(1.08)}.cal,.chev{color:var(--cyan);font-size:22px;text-align:center}.run-date{font-size:18px;font-weight:850}.count-pill{border:1px solid var(--search-border);border-radius:999px;color:var(--cyan);background:var(--control-bg);padding:6px 12px;font-weight:800;white-space:nowrap}.run-songs{display:none;padding:0 16px}.run.open .run-songs{display:block}.run.open .chev{transform:rotate(180deg)}.song-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:15px 4px;border-top:1px solid var(--line)}.song-title{font-weight:850;font-size:16px}.song-artist,.song-tuning{color:var(--soft-text)}.history-loading{color:var(--muted);padding:28px 4px}@media(max-width:620px){.run-head{grid-template-columns:24px 1fr 24px}.count-pill{grid-column:2}.song-row{grid-template-columns:1fr}.song-tuning{justify-self:start}}.page-nav{margin-top:0}.sidebar-stats{position:static;left:auto;right:auto;bottom:auto;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}</style></head><body><div class="mobile"><button class="hamb" id="hamb" type="button">☰</button><div class="mobile-title">THE SHOP <span>SONGBOOK</span></div><img alt="The Shop Songbook logo" src="logo.png"/></div><aside class="sidebar" id="sidebar"><div class="brand"><img alt="The Shop Songbook logo" src="logo.png"/><div class="brand-text">THE SHOP<span>SONGBOOK</span></div></div><nav class="nav page-nav"><a href="https://datadragontechnologies.com/"><span class="ico">←</span>Back to Data Dragon</a><a href="index.html"><span class="ico">♫</span>Songbook</a><a class="active" href="recent.html"><span class="ico">◷</span>Recently Added</a><a href="request.html"><span class="ico">＋</span>Request a Song</a><a href="requests.html"><span class="ico">★</span>Request Status</a></nav><div class="sidebar-stats"><span><b id="requestPending">—</b>Requested</span><span><b id="requestAdded">—</b>Added</span></div></aside><main class="main"><div class="wrap"><section class="hero"><h1>Recently <span>added.</span></h1><p>See what songs were added during each Setlist update. Select a date to view the songs added in that run.</p></section><section class="runs" id="runs"><div class="history-loading">Loading Setlist history...</div></section></div></main><script>var API='https://script.google.com/macros/s/AKfycbx5EPKuoSLjsOj94G1Dufnq1PzZwuNo0cMUQ8ZMMns9fbKO67HFDgHr0zu7lkAAWOPI/exec',n=0;function buildRun(x,o){var box=document.createElement('section');box.className='run'+(o?' open':'');var h=document.createElement('button');h.className='run-head';h.innerHTML='<span class="cal">▣</span><span class="run-date"></span><span class="count-pill"></span><span class="chev">⌄</span>';h.querySelector('.run-date').textContent=x.label;h.querySelector('.count-pill').textContent=x.songs.length+' song'+(x.songs.length===1?'':'s')+' added';var songs=document.createElement('div');songs.className='run-songs';x.songs.forEach(function(q){var row=document.createElement('div');row.className='song-row';row.innerHTML='<div><div class="song-title"></div><div class="song-artist"></div></div><div class="song-tuning"></div>';row.querySelector('.song-title').textContent=q.title;row.querySelector('.song-artist').textContent=q.artist;row.querySelector('.song-tuning').textContent=q.tuning||'Unknown Tuning';songs.appendChild(row);});h.onclick=function(){box.classList.toggle('open');};box.appendChild(h);box.appendChild(songs);return box;}function loadHistory(){n++;var cb='recentHistory_'+Date.now()+'_'+n,sc=document.createElement('script');window[cb]=function(d){try{var miniSongs=document.getElementById('miniSongs'),miniArtists=document.getElementById('miniArtists'),miniTunings=document.getElementById('miniTunings'),requestPending=document.getElementById('requestPending'),requestAdded=document.getElementById('requestAdded'),runs=document.getElementById('runs');if(miniSongs)miniSongs.textContent=d.catalog.songs;if(miniArtists)miniArtists.textContent=d.catalog.artists;if(miniTunings)miniTunings.textContent=d.catalog.tunings;if(requestPending)requestPending.textContent=d.requests.requested;if(requestAdded)requestAdded.textContent=d.requests.added;if(!runs)throw new Error('Recently Added runs container not found');runs.innerHTML='';if(!d.runs.length){runs.innerHTML='<div class="history-loading">No Setlist update history has been recorded yet.</div>';return;}d.runs.forEach(function(x,i){runs.appendChild(buildRun(x,i===0));});}finally{try{delete window[cb];}catch(e){}if(sc.parentNode)sc.parentNode.removeChild(sc);}};sc.src=API+'?'+new URLSearchParams({action:'getRecentRuns',callback:cb,_:Date.now()}).toString();document.body.appendChild(sc);}loadHistory();hamb.onclick=function(){sidebar.classList.toggle('open');};</script></body></html>
