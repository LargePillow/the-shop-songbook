<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Requests | The Shop Songbook</title><link rel="icon" href="favicon.png"><style>*{box-sizing:border-box}:root{--line:#1e4a73;--text:#f4f8ff;--cyan:#20c9ff;--hero-a:#03101f;--hero-b:#061a31;--hero-c:#04101f;--card-a:#0a2039;--card-b:#0a1b31;--soft-text:#b8cce2;--muted:#95b2cf}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:linear-gradient(145deg,var(--hero-a),var(--hero-b),var(--hero-c));padding:24px}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:var(--soft-text);font-weight:800;text-decoration:none}.brand{height:52px}.hero{padding:42px 0 26px}h1{font-size:clamp(38px,8vw,72px);margin:0}h1 span,.votes,.stat b{color:var(--cyan)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat,.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--card-a),var(--card-b));padding:18px}.stat b{font-size:28px;display:block}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.artist{color:var(--soft-text)}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 11px}.votes{font-weight:900}.empty{color:var(--muted);text-align:center;padding:36px}@media(max-width:560px){.stats{grid-template-columns:1fr}.card{grid-template-columns:1fr}.brand{display:none}}</style><link rel="stylesheet" href="theme.css"></head><body><main class="wrap"><div class="top"><a href="request.html">← Request a Song</a><img class="brand" src="logo.png" alt="The Shop Songbook"></div><section class="hero"><h1>Song <span>requests.</span></h1><p>See what has been requested and what was recently added. Requester email addresses are never displayed.</p></section><section class="stats"><div class="stat"><b id="requested">–</b>Requested</div><div class="stat"><b id="added">–</b>Added</div><div class="stat"><b id="votes">–</b>Total votes</div></section><section id="list" class="list"><div class="empty">Loading requests…</div></section></main><script>var API='https://script.google.com/macros/s/AKfycbx5EPKuoSLjsOj94G1Dufnq1PzZwuNo0cMUQ8ZMMns9fbKO67HFDgHr0zu7lkAAWOPI/exec',n=0;function load(){n++;var cb='requestListCallback_'+Date.now()+'_'+n,s=document.createElement('script');window[cb]=function(data){delete window[cb];s.remove();document.getElementById('requested').textContent=data.stats.requested;document.getElementById('added').textContent=data.stats.added;document.getElementById('votes').textContent=data.stats.votes;var list=document.getElementById('list');list.innerHTML='';if(!data.requests.length){list.innerHTML='<div class="empty">No requests yet.</div>';return;}data.requests.forEach(function(r){var card=document.createElement('article'),left=document.createElement('div'),name=document.createElement('strong'),artist=document.createElement('div'),right=document.createElement('div'),votes=document.createElement('span'),badge=document.createElement('span');card.className='card';name.textContent=r.title;artist.className='artist';artist.textContent=r.artist;votes.className='votes';votes.textContent=r.requests+' vote'+(r.requests===1?'':'s')+' ';badge.className='badge';badge.textContent=r.status;left.appendChild(name);left.appendChild(artist);right.appendChild(votes);right.appendChild(badge);card.appendChild(left);card.appendChild(right);list.appendChild(card);});};var p=new URLSearchParams({action:'getRequests',callback:cb,_:Date.now()});s.src=API+'?'+p.toString();s.onerror=function(){document.getElementById('list').innerHTML='<div class="empty">Unable to load requests.</div>';};document.body.appendChild(s);}load();</script></body></html>
