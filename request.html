<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061426"><title>Request a Song | The Shop Songbook</title><link rel="icon" type="image/png" sizes="128x128" href="favicon.png"><style>
*{box-sizing:border-box}:root{--line:#1e4a73;--text:#f4f8ff;--cyan:#20c9ff;--tune:#0b6495;--tune-border:#54ddff;--page-bg:#051527;--sidebar-bg:#031325f2;--hero-a:#03101f;--hero-b:#061a31;--hero-c:#04101f;--hero-glow:#0d477055;--divider:#153957;--control-bg:#0b2745;--control-border:#2c6390;--card-a:#0a2039;--card-b:#0a1b31;--muted:#95b2cf;--soft-text:#b8cce2;--search-bg:#0b2847cc;--search-border:#4fa9e5;--active-bg:#0a527d;--chip-bg:#0b3658;--pill-bg:#173b61;--pill-border:#3f75a5;--more-bg:#0a3659;--top-bg:#092c4b;--mobile-bg:#041426f3}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 70% 12%,var(--hero-glow),transparent 31%),linear-gradient(145deg,var(--hero-a),var(--hero-b) 56%,var(--hero-c));display:grid;place-items:center;padding:28px 16px}.page{width:min(680px,100%)}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.back{color:var(--soft-text);text-decoration:none;font-weight:750}.back:hover{color:var(--cyan)}.brand{display:flex;align-items:center;gap:9px;font-weight:900}.brand img{width:45px;height:45px;object-fit:contain}.brand span{color:var(--cyan)}.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--card-a),var(--card-b));box-shadow:0 22px 60px #0007;padding:clamp(24px,5vw,46px)}h1{font-size:clamp(36px,8vw,58px);line-height:.98;letter-spacing:-.04em;margin:0 0 13px}h1 span{color:var(--cyan);text-shadow:0 0 24px color-mix(in srgb,var(--cyan) 35%,transparent)}.intro{color:var(--soft-text);margin:0 0 31px;line-height:1.55}.field{display:grid;gap:8px;margin:0 0 18px}.field label{font-weight:800}.field input{width:100%;height:52px;border:1px solid var(--control-border);border-radius:12px;background:var(--control-bg);color:var(--text);padding:0 15px;font-size:17px;outline:0}.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 20%,transparent)}.submit{width:100%;height:52px;border:1px solid var(--search-border);border-radius:12px;background:var(--active-bg);color:#fff;font-weight:900;cursor:pointer;margin-top:7px}.submit:hover{filter:brightness(1.12)}.submit:disabled{opacity:.58;cursor:not-allowed}.status{display:none;margin:18px 0 0;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--page-bg);line-height:1.45}.status.show{display:block}.status.success{border-color:#2f9e58;color:#b9f6ca}.status.warn{border-color:var(--tune-border);color:var(--text)}.status.error{border-color:#f87171;color:#fecaca}.small{color:var(--muted);font-size:12px;margin:16px 0 0;text-align:center}@media(max-width:520px){body{padding:16px 12px;place-items:start center}.topline{align-items:flex-start}.brand div{display:none}.panel{padding:25px 18px;border-radius:14px}.brand img{width:40px;height:40px}}
</style><link rel="stylesheet" href="theme.css"></head><body><main class="page"><div class="topline"><a class="back" href="index.html">← Back to Songbook</a><div class="brand"><img src="logo.png" alt="The Shop Songbook logo"><div>THE SHOP <span>SONGBOOK</span></div></div></div><section class="panel"><h1>Request a <span>song.</span></h1><p class="intro">Enter the artist and song title. The Songbook will check for an existing song before sending the request.</p><form id="requestForm" novalidate><div class="field"><label for="artist">Artist</label><input id="artist" name="artist" type="text" autocomplete="off" maxlength="120" required placeholder="Artist name"></div><div class="field"><label for="title">Song Title</label><input id="title" name="title" type="text" autocomplete="off" maxlength="160" required placeholder="Song title"></div><div class="field"><label for="email">Email <span style="font-weight:500;color:var(--muted)">(optional)</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="Get notified if the song is added"></div><button id="submit" class="submit" type="submit">Submit Request</button><div id="status" class="status" role="status" aria-live="polite"></div></form><p class="small">Email is optional and is used only to notify the requester if the song is added.</p></section></main><script>
const API='https://script.google.com/macros/s/AKfycbx5EPKuoSLjsOj94G1Dufnq1PzZwuNo0cMUQ8ZMMns9fbKO67HFDgHr0zu7lkAAWOPI/exec';
const form=document.querySelector('#requestForm');
const artist=document.querySelector('#artist');
const title=document.querySelector('#title');
const email=document.querySelector('#email');
const button=document.querySelector('#submit');
const statusBox=document.querySelector('#status');
function show(message,type='warn'){statusBox.textContent=message;statusBox.className='status show '+type;}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const a=artist.value.trim(),t=title.value.trim(),m=email.value.trim();
  if(!a||!t){show('Please enter both the artist and song title.','error');return;}
  if(m&&!email.checkValidity()){show('Please enter a valid email address or leave it blank.','error');return;}
  button.disabled=true; button.textContent='Submitting…';
  show('Checking and submitting your request…','warn');
  try{
    const qs=new URLSearchParams({action:'requestSong',artist:a,title:t,email:m,_:Date.now()});
    const response=await fetch(API+'?'+qs.toString(),{method:'GET',cache:'no-store',redirect:'follow'});
    const raw=await response.text();
    if(!response.ok) throw new Error('The request service returned '+response.status+'.');
    let result;
    try{result=JSON.parse(raw);}catch(_){throw new Error('The request service returned an unexpected response.');}
    if(result.status==='alreadyExists'||result.alreadyExists===true){show(result.message||'That song is already in the Songbook. No request was sent.','warn');return;}
    if(result.status==='duplicate'||result.duplicate===true){show(result.message||'That song has already been requested. No duplicate request was added.','warn');return;}
    if(result.status!=='success'&&result.success!==true) throw new Error(result.message||'The request could not be submitted.');
    show(`Request submitted! ${a} — ${t} has been added to the request list. Thanks for helping grow The Shop Songbook!`,'success');
    form.reset();
    statusBox.scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(error){show(error.message||'The request could not be submitted. Please try again.','error');statusBox.scrollIntoView({behavior:'smooth',block:'nearest'});}
  finally{button.disabled=false;button.textContent='Submit Request';}
});
</script></body></html>
