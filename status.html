<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Song Requests | The Shop Songbook</title><link href="favicon.png" rel="icon"/><style>*{box-sizing:border-box}:root{--line:#1e4a73;--text:#f4f8ff;--cyan:#20c9ff;--tune:#0b6495;--tune-border:#54ddff;--page-bg:#051527;--sidebar-bg:#031325f2;--hero-a:#03101f;--hero-b:#061a31;--hero-c:#04101f;--hero-glow:#0d477055;--divider:#153957;--control-bg:#0b2745;--control-border:#2c6390;--card-a:#0a2039;--card-b:#0a1b31;--muted:#95b2cf;--soft-text:#b8cce2;--search-bg:#0b2847cc;--search-border:#4fa9e5;--active-bg:#102d50;--chip-bg:#0b3658;--pill-bg:#173b61;--pill-border:#3f75a5;--more-bg:#0a3659;--top-bg:#092c4b;--mobile-bg:#041426f3}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:linear-gradient(145deg,var(--hero-a),var(--hero-b),var(--hero-c))}.mobile{display:none;position:sticky;top:0;z-index:90;padding:10px 14px;background:var(--mobile-bg);border-bottom:1px solid var(--tune-border);align-items:center;justify-content:space-between}.mobile img{width:38px;height:38px;object-fit:contain}.mobile-title{font-weight:850}.mobile-title span{color:var(--cyan)}.hamb{border:1px solid var(--active-bg);border-radius:9px;background:var(--control-bg);color:var(--text);padding:8px 12px}.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;padding:24px 15px;border-right:1px solid var(--divider);background:var(--sidebar-bg);z-index:85}.brand{display:flex;align-items:center;gap:10px;padding:3px 9px 26px}.brand img{width:64px;height:64px;object-fit:contain}.brand-text{font-weight:850;line-height:.92;font-size:18px;white-space:nowrap}.brand-text span{display:block;color:var(--cyan);font-size:21px}.nav{display:grid;gap:7px}.nav a{display:flex;align-items:center;gap:12px;min-height:46px;width:100%;padding:11px 14px;border:1px solid transparent;border-radius:10px;color:var(--soft-text);background:transparent;text-decoration:none}.nav a:hover{background:var(--control-bg);border-color:var(--line);color:var(--text)}.ico{width:22px;color:var(--cyan)}.sidebar-stats{position:absolute;left:15px;right:15px;bottom:22px;display:grid;grid-template-columns:1fr 1fr;gap:8px;color:var(--muted);font-size:12px;text-align:center}.sidebar-stats b{display:block;color:var(--cyan);font-size:24px;line-height:1.1;margin-bottom:4px}.main{margin-left:250px;min-height:100vh;padding:54px 30px 70px}.wrap{max-width:1110px;margin:0 auto}.hero{padding:0 0 30px}.hero h1{font-size:clamp(52px,7vw,82px);line-height:.95;letter-spacing:-.045em;margin:0 0 24px}.hero h1 span{color:var(--cyan)}.hero p{color:var(--soft-text);font-size:17px;line-height:1.55}@media(max-width:820px){.mobile{display:flex}.sidebar{top:59px;bottom:0;height:auto;width:265px;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;padding:34px 16px 55px}.sidebar-stats{bottom:18px}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 24px}.stat,.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--card-a),var(--card-b));padding:18px}.stat b{font-size:30px;color:var(--cyan);display:block}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.artist{color:var(--soft-text)}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 11px}.votes{color:var(--cyan);font-weight:900}.empty{color:var(--muted);text-align:center;padding:36px}@media(max-width:560px){.stats{grid-template-columns:1fr}.card{grid-template-columns:1fr}}.nav .active{background:var(--active-bg);border-color:var(--line);color:var(--text)}.sidebar-stats{position:static;left:auto;right:auto;bottom:auto;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.loading-wrap{display:grid;gap:12px}.loading-line{position:relative;overflow:hidden}.loading-line::after,.stat.loading b::after{content:"";display:block;position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(32,201,255,.16),transparent);animation:requestShimmer 1.35s infinite}.stat.loading{position:relative;overflow:hidden;background:transparent!important}.stat.loading b{color:transparent;position:relative;width:42px;height:30px;border-radius:7px;background:rgba(149,178,207,.13)}.skeleton-card{height:88px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--card-a),var(--card-b));padding:18px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative}.skeleton-card::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(32,201,255,.13),transparent);animation:requestShimmer 1.35s infinite}.skeleton-copy{display:grid;gap:10px;width:min(55%,340px)}.skeleton-bar{height:13px;border-radius:999px;background:rgba(149,178,207,.18)}.skeleton-bar.short{width:62%}.skeleton-pill{width:100px;height:30px;border-radius:999px;background:rgba(149,178,207,.15)}@keyframes requestShimmer{100%{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){.loading-line::after,.stat.loading b::after,.skeleton-card::after{animation:none}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 28px;padding:0;border:0;background:transparent}.stats .stat{border:0!important;border-radius:0!important;background:transparent!important;padding:10px 22px 14px!important;box-shadow:none!important}.stats .stat b{font-size:clamp(42px,6vw,62px);line-height:1;font-weight:850;margin-bottom:10px}.stats .stat:not(:last-child){border-right:1px solid var(--divider)!important}@media(max-width:560px){.stats{grid-template-columns:repeat(3,1fr);gap:0}.stats .stat{padding:8px 8px 12px!important;text-align:center}.stats .stat b{font-size:clamp(30px,11vw,46px)}.stats .stat:not(:last-child){border-right:1px solid var(--divider)!important}}.stats .stat.loading b{display:block;width:60px;height:7px;margin:20px 0 24px;background:var(--cyan)!important;border-radius:0;color:transparent;overflow:hidden;position:relative}.stats .stat.loading b::after{content:none!important}.stats .stat.loading{overflow:visible!important}@media(max-width:560px){.stats .stat.loading b{width:48px;height:6px;margin:16px auto 20px}}.stats .stat.loading b{display:block;width:60px;height:7px;margin:20px 0 24px;background:var(--text)!important;border-radius:0;color:transparent;overflow:hidden;position:relative;opacity:1}.stats .stat.loading b::after{content:none!important}@media(max-width:560px){.stats .stat.loading b{width:48px;height:6px;margin:16px auto 20px}}.stats .stat{color:var(--soft-text)!important}.stats .stat b{color:var(--text)!important;font-size:clamp(42px,6vw,62px);font-weight:850}.stats .stat.loading b{background:var(--text)!important;color:transparent!important}.request-search{display:flex;align-items:center;gap:10px;border:1px solid var(--search-border);background:var(--search-bg);border-radius:999px;padding:0 16px;margin:0 0 18px}.request-search input{width:100%;height:46px;border:0;outline:0;background:transparent;color:var(--text)}.request-search input::placeholder{color:var(--muted)}</style><link href="theme.css" rel="stylesheet"/></head><body><div class="mobile"><button class="hamb" id="hamb" type="button">☰</button><div class="mobile-title">THE SHOP <span>SONGBOOK</span></div><img alt="The Shop Songbook logo" src="logo.png"/></div><aside class="sidebar" id="sidebar"><div class="brand"><img alt="The Shop Songbook logo" src="logo.png"/><div class="brand-text">THE SHOP<span>SONGBOOK</span></div></div><nav class="nav page-nav"><a href="https://datadragontechnologies.com/"><span class="ico">←</span>Back to Data Dragon</a><a href="index.html"><span class="ico">♫</span>Songbook</a><a href="added.html"><span class="ico">◷</span>Recently Added</a><a href="request.html"><span class="ico">＋</span>Request a Song</a><a class="active" href="status.html"><span class="ico">★</span>Request Status</a></nav></aside><main class="main"><div class="wrap"><section class="hero"><h1>Song <span>requests.</span></h1><p>See what has been requested and what was recently added.</p></section><section class="stats"><div class="stat loading" id="requestedStat"><b id="requested">—</b>Requested</div><div class="stat loading" id="addedStat"><b id="added">—</b>Added</div><div class="stat loading" id="votesStat"><b id="votes">—</b>Total votes</div></section><label class="request-search"><span>⌕</span><input id="requestSearch" type="search" placeholder="Search requests by song or artist..."></label><section class="list loading-wrap" id="list"><div class="skeleton-card"><div class="skeleton-copy"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div><div class="skeleton-pill"></div></div><div class="skeleton-card"><div class="skeleton-copy"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div><div class="skeleton-pill"></div></div><div class="skeleton-card"><div class="skeleton-copy"><div class="skeleton-bar"></div><div class="skeleton-bar short"></div></div><div class="skeleton-pill"></div></div></section></div></main><script>var allRequests=[];var API='https://script.google.com/macros/s/AKfycbx5EPKuoSLjsOj94G1Dufnq1PzZwuNo0cMUQ8ZMMns9fbKO67HFDgHr0zu7lkAAWOPI/exec',n=0;function load(){n++;var cb='reqList_'+Date.now()+'_'+n,sc=document.createElement('script');window[cb]=function(d){try{document.getElementById('requested').textContent=d.stats.requested;document.getElementById('added').textContent=d.stats.added;document.getElementById('votes').textContent=d.stats.votes;['requestedStat','addedStat','votesStat'].forEach(function(id){document.getElementById(id).classList.remove('loading');});document.getElementById('list').classList.remove('loading-wrap');var requestPending=document.getElementById('requestPending'),requestAdded=document.getElementById('requestAdded');if(requestPending)requestPending.textContent=d.stats.requested;if(requestAdded)requestAdded.textContent=d.stats.added;allRequests=d.requests||[];renderRequests();}finally{try{delete window[cb];}catch(e){}if(sc.parentNode)sc.parentNode.removeChild(sc);}};sc.onerror=function(){var list=document.getElementById('list');list.classList.remove('loading-wrap');list.innerHTML='<div class="empty">Request data could not be loaded. Refresh the page to try again.</div>';};sc.src=API+'?'+new URLSearchParams({action:'getRequests',callback:cb,_:Date.now()}).toString();document.body.appendChild(sc);}function getVoterId(){var key='shopSongbookVoterId',id='';try{id=localStorage.getItem(key)||'';if(!id){id='v_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);localStorage.setItem(key,id);}}catch(e){id='session_'+Math.random().toString(36).slice(2);}return id;}function votedKey(id){return 'shopSongbookVoted_'+id;}function hasVoted(id){try{return localStorage.getItem(votedKey(id))==='1';}catch(e){return false;}}function rememberVote(id){try{localStorage.setItem(votedKey(id),'1');}catch(e){}}function upvoteRequest(r,button,voteText){if(button.disabled||hasVoted(r.id))return;button.disabled=true;button.textContent='Adding vote...';n++;var cb='upvote_'+Date.now()+'_'+n,sc=document.createElement('script'),done=false;function clean(){if(sc.parentNode)sc.parentNode.removeChild(sc);try{delete window[cb];}catch(e){}}window[cb]=function(d){if(done)return;done=true;clean();if(d&&d.success){r.requests=Number(d.requests)||r.requests+1;voteText.textContent=r.requests+' vote'+(r.requests===1?'':'s');rememberVote(r.id);button.textContent=d.status==='alreadyVoted'?'Already voted':'Voted';button.disabled=true;document.getElementById('votes').textContent=allRequests.reduce(function(sum,x){return sum+(Number(x.requests)||0);},0);}else{button.disabled=false;button.textContent='Upvote';alert(d&&d.message?d.message:'The vote could not be added.');}};sc.onerror=function(){if(done)return;done=true;clean();button.disabled=false;button.textContent='Upvote';};sc.src=API+'?'+new URLSearchParams({action:'upvoteRequest',id:r.id,voterId:getVoterId(),artist:r.artist,title:r.title,email:'',callback:cb,_:Date.now()}).toString();document.body.appendChild(sc);}function renderRequests(){var list=document.getElementById('list'),input=document.getElementById('requestSearch'),term=(input?input.value:'').trim().toLowerCase(),filtered=allRequests.filter(function(r){return !term||(String(r.title||'')+' '+String(r.artist||'')).toLowerCase().indexOf(term)!==-1;});list.innerHTML='';if(!filtered.length){list.innerHTML='<div class="empty">'+(term?'No matching requests.':'No requests yet.')+'</div>';return;}filtered.forEach(function(r){var card=document.createElement('article'),left=document.createElement('div'),name=document.createElement('strong'),a=document.createElement('div'),right=document.createElement('div'),v=document.createElement('span'),b=document.createElement('span');card.className='card';name.textContent=r.title;a.className='artist';a.textContent=r.artist;v.className='votes';v.textContent=r.requests+' vote'+(r.requests===1?'':'s')+' ';b.className='badge';b.textContent=r.status;left.appendChild(name);left.appendChild(a);right.appendChild(v);right.appendChild(b);card.appendChild(left);card.appendChild(right);list.appendChild(card);});}document.getElementById('requestSearch').addEventListener('input',renderRequests);load();document.getElementById('hamb').onclick=function(){document.getElementById('sidebar').classList.toggle('open');};</script></body></html>
