<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061426"><meta name="description" content="The Shop Songbook: songs, lyrics, artists, and guitar tunings."><title>The Shop Songbook</title><link rel="icon" type="image/png" sizes="128x128" href="favicon.png"><link rel="shortcut icon" type="image/png" href="favicon.png"><style>
*{box-sizing:border-box}:root{--line:#1e4a73;--text:#f4f8ff;--cyan:#20c9ff;--tune:#0b6495;--tune-border:#54ddff}html{scroll-behavior:smooth;color-scheme:dark}body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 72% 12%,#0d477055,transparent 30%),linear-gradient(145deg,#03101f,#061a31 56%,#04101f);min-height:100vh}button,input,select,a{font:inherit}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:24px 15px;border-right:1px solid #153957;background:#031325f2;z-index:30}.brand{display:flex;align-items:center;gap:10px;padding:3px 9px 26px}.brand img{width:64px;height:64px;object-fit:contain}.brand-text{font-weight:850;line-height:.92;font-size:18px;white-space:nowrap}.brand-text span{display:block;color:var(--cyan);font-size:21px}.nav{display:grid;gap:7px}.nav a,.nav button{display:flex;align-items:center;gap:12px;min-height:46px;width:100%;padding:11px 14px;border:1px solid transparent;border-radius:10px;color:#b8cce2;background:transparent;text-decoration:none;text-align:left;cursor:pointer}.nav a:hover,.nav button:hover,.nav .active{background:#102d50;border-color:#1a4773;color:#fff}.nav-count{margin-left:auto;color:#69d9ff;font-size:12px}.ico{width:22px;color:var(--cyan)}.main{min-width:0;background:#051527;min-height:100vh}.hero{padding:50px 48px 28px;background:radial-gradient(circle at 72% 12%,#0d477055,transparent 30%),linear-gradient(145deg,#03101f,#061a31 56%,#04101f);border-bottom:1px solid #153957}.hero h1{font-size:clamp(43px,6vw,78px);line-height:.95;margin:0 0 24px;letter-spacing:-.045em}.hero h1 span{color:var(--cyan);text-shadow:0 0 24px #20c9ff55}.tagline{color:#bfd0e5;font-size:17px;margin:0 0 32px}.search{display:flex;align-items:center;gap:12px;width:min(980px,100%);border:1px solid #4fa9e5;background:#0b2847cc;border-radius:34px;padding:0 20px}.search input{width:100%;height:48px;border:0;outline:0;background:transparent;color:#fff;font-size:17px}.stats{display:flex;gap:54px;flex-wrap:wrap;margin:26px 3px 0}.stat strong{display:block;font-size:34px;line-height:1}.stat small{display:block;color:#b8cce2;margin-top:7px;font-size:13px}.updated{margin-top:16px;color:#a7bfd8;font-size:13px}.content{padding:20px 28px 62px;background:#051527}.sticky-controls{position:sticky;top:0;z-index:50;background:#051527;backdrop-filter:blur(16px);padding:12px 8px 0;border-bottom:0;box-shadow:none}.sticky-controls .search{width:100%;max-width:none;margin-bottom:16px}.toolbar{position:static;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:0;padding:11px 8px;background:transparent;border-bottom:0;backdrop-filter:none}.toolbar select,.toolbar button{height:42px;border:1px solid #2c6390;border-radius:10px;background:#0b2745;color:#e8f3ff;padding:0 13px;cursor:pointer}.views{margin-left:auto;display:flex;gap:5px}.views button.active{background:#0a527d;color:var(--cyan)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid #4fa9e5;background:#0b3658;color:#dff7ff;border-radius:999px;padding:7px 11px;cursor:pointer}.chip.tuning-chip{border-color:var(--tune-border);background:var(--tune);color:#fff}.results{color:#95b2cf;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px}.card{padding:17px;background:linear-gradient(145deg,#0a2039,#0a1b31);border:1px solid var(--line);border-radius:12px;box-shadow:0 9px 26px #0003;transition:.16s}.card:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 0 0 1px #4fa9e533,0 12px 30px #4fa9e518}.artist{padding:0;border:0;background:none;color:var(--cyan);font-size:14px;font-weight:800;cursor:pointer}.title{font-size:20px;font-weight:850;margin:5px 0 13px}.badges{display:flex;gap:7px;flex-wrap:wrap}.pill{min-height:28px;border-radius:999px;padding:4px 10px;font-size:12px;text-decoration:none;border:1px solid #3f75a5;background:#173b61;color:#e7f3ff;cursor:pointer;transition:.14s}.pill:hover{transform:translateY(-2px) scale(1.025);box-shadow:0 6px 14px #0006}.pill.tuning.active{border-color:var(--tune-border);background:var(--tune);color:#fff;box-shadow:0 0 0 2px #4fa9e533,0 0 16px #20c9ff55}.pill.lyrics{border-color:#29894d;background:#0d6b31}.pill.nolyrics{border-color:#f87171;background:#991b1b;color:#fff}.directory{display:none;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px}.directory.show{display:grid}.dircard{padding:18px;border:1px solid var(--line);border-radius:12px;background:#0a2039;cursor:pointer;color:#fff;text-align:left}.dircard:hover{border-color:var(--cyan);transform:translateY(-2px)}.dircard strong{display:block;color:var(--cyan)}.dircard span{color:#8eabc8;font-size:13px}.arrow{float:right;color:var(--cyan)}.empty{grid-column:1/-1;padding:25px;border:1px solid var(--line);border-radius:12px;color:#9cb6cf}.more[hidden]{display:none!important}.more{display:block;margin:24px auto 0;padding:12px 22px;border:1px solid #2e7dab;border-radius:999px;background:#0a3659;color:#fff;cursor:pointer}.top{position:fixed;right:20px;bottom:20px;min-width:58px;height:46px;padding:0 15px;border:1px solid #4fa9e5;border-radius:999px;background:#092c4b;color:#fff;font-weight:750;opacity:0;visibility:hidden}.top.show{opacity:1;visibility:visible}.mobile{display:none;position:sticky;top:0;z-index:40;padding:10px 14px;background:#041426f3;border-bottom:1px solid #153957}.mobile img{width:38px;height:38px;object-fit:contain}.mobile-title{font-weight:850}.mobile-title .songbook{color:var(--cyan)}.hamb{border:1px solid #0a527d;border-radius:9px;background:#0b2745;color:#fff;padding:8px 12px}.skeleton{height:132px;border-radius:12px;background:linear-gradient(90deg,#0a1d33 25%,#123556 38%,#0a1d33 63%);background-size:400% 100%;animation:shine 1.25s infinite}@keyframes shine{to{background-position:-400% 0}}@media(max-width:1180px){.grid{grid-template-columns:repeat(2,1fr)}.directory{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.app{display:block}.mobile{display:flex;justify-content:space-between;align-items:center}.sidebar{position:fixed;left:0;top:59px;bottom:0;width:265px;height:auto;transform:translateX(-105%);transition:.2s;z-index:80}.sidebar.open{transform:none}.hero{padding:34px 18px 24px}.content{padding:14px 12px}.sticky-controls{top:60px;padding:10px 0 0;border-top:1px solid #153957}.sticky-controls .search{margin:0 0 16px}.sticky-controls .search input{height:46px}.grid{grid-template-columns:1fr}.directory{grid-template-columns:repeat(2,1fr)}.sticky-controls{position:static;top:auto;z-index:auto;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;padding-top:10px;border:0;box-shadow:none}.mobile{border-bottom:1px solid #54ddff}.content{padding-top:0}}@media(max-width:520px){.hero h1{font-size:40px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar select,.toolbar button{width:100%}.views{grid-column:1/-1;grid-row:2;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.toolbar>#reset{grid-column:1/-1;grid-row:3;width:100%}.directory{grid-template-columns:1fr}}

.nav-request{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.nav-request a{display:flex;align-items:center;gap:12px;min-height:46px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:transparent;text-decoration:none}.nav-request a:hover{border-color:var(--cyan);color:var(--cyan)}.page-nav{margin-top:0}.request-stats{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px;color:#95b2cf;font-size:12px;text-align:center}.request-stats b{display:block;color:var(--cyan);font-size:22px;line-height:1.1;margin-bottom:4px}</style></head><body><div class="mobile"><button id="hamb" class="hamb">☰</button><div class="mobile-title">THE SHOP <span class="songbook">SONGBOOK</span></div><img src="logo.png" alt="The Shop Songbook logo"></div><div class="app"><aside id="sidebar" class="sidebar"><div class="brand"><img src="logo.png" alt="The Shop Songbook logo"><div class="brand-text">THE SHOP<span>SONGBOOK</span></div></div><nav class="nav page-nav"><a href="https://datadragontechnologies.com/"><span class="ico">←</span>Back to Data Dragon</a><a href="index.html" class="active"><span class="ico">♫</span>Songbook</a><a href="request.html"><span class="ico">＋</span>Request a Song</a><a href="requests.html"><span class="ico">★</span>Request Status</a></nav><div class="request-stats"><span><b id="requestPending">—</b>Requested</span><span><b id="requestAdded">—</b>Added</span></div><div hidden><span id="sideSongs"></span><span id="sideArtists"></span><span id="sideTunings"></span></div></aside><main class="main"><section class="hero"><h1>Find the next <span>song.</span></h1><p class="tagline">The soundtrack of the shop.</p><div class="stats"><div class="stat"><strong id="songCount">—</strong><small>Songs</small></div><div class="stat"><strong id="artistCount">—</strong><small>Artists</small></div><div class="stat"><strong id="tuningCount">—</strong><small>Tunings</small></div></div><div id="updated" class="updated"></div></section><section class="content"><div class="sticky-controls"><label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search by song, artist, or tuning..."></label><div class="toolbar"><select id="tun"><option value="">All Tunings</option></select><select id="sort"><option value="artist-asc">Artist A–Z</option><option value="artist-desc">Artist Z–A</option><option value="song-asc">Song A–Z</option><option value="song-desc">Song Z–A</option></select><button id="reset">Reset</button><div class="views"><button class="active" data-view="songs">Songs</button><button data-view="artists">Artists</button><button data-view="tunings">Tunings</button></div></div></div><div id="chips" class="chips"></div><p id="results" class="results">Loading songbook…</p><div id="grid" class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div id="directory" class="directory"></div><button id="more" class="more" hidden style="display:none">Load more songs</button></section></main></div><button id="topButton" class="top">Top</button><script>
const API='https://script.google.com/macros/s/AKfycbx5EPKuoSLjsOj94G1Dufnq1PzZwuNo0cMUQ8ZMMns9fbKO67HFDgHr0zu7lkAAWOPI/exec',PAGE=60,$=s=>document.querySelector(s),q=$('#q'),tf=$('#tun'),sf=$('#sort'),grid=$('#grid'),dir=$('#directory'),more=$('#more'),results=$('#results');let songs=[],visible=PAGE,artistFilter='',tuningFilter='',mode='songs',updatedAt='';const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),lyrics=s=>'https://www.google.com/search?'+new URLSearchParams({q:`${s.artist} ${s.title} lyrics`}),fmt=x=>Number(x).toLocaleString();function tuningCounts(){const counts=new Map();songs.forEach(s=>String(s.tuning||'Unknown Tuning').split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>counts.set(t,(counts.get(t)||0)+1)));return[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}function allTunings(){return tuningCounts().map(([name])=>name)}function activeTuning(){return tuningFilter||tf.value}function updateSortOptions(nextMode=mode){const current=sf.value;const options=nextMode==='songs'?[['song-asc','Song A–Z'],['song-desc','Song Z–A'],['artist-asc','Artist A–Z'],['artist-desc','Artist Z–A']]:nextMode==='artists'?[['name-asc','Artist A–Z'],['name-desc','Artist Z–A'],['count-desc','Count ↓'],['count-asc','Count ↑']]:[['count-desc','Count ↓'],['count-asc','Count ↑'],['name-asc','Tuning A–Z'],['name-desc','Tuning Z–A']];sf.innerHTML=options.map(([value,label])=>`<option value="${value}">${label}</option>`).join('');const defaultValue=nextMode==='songs'?'song-asc':nextMode==='artists'?'name-asc':'count-desc';sf.value=options.some(([value])=>value===current)?current:defaultValue}function filtered(){const z=norm(q.value),t=activeTuning();let a=songs.filter(s=>(!z||norm(`${s.artist} ${s.title} ${s.tuning} ${s.searchAliases||''}`).includes(z))&&(!artistFilter||s.artist===artistFilter)&&(!t||String(s.tuning).split(',').map(x=>x.trim()).includes(t)));a.sort((x,y)=>{const A=norm(x.artist).localeCompare(norm(y.artist))||norm(x.title).localeCompare(norm(y.title)),S=norm(x.title).localeCompare(norm(y.title))||norm(x.artist).localeCompare(norm(y.artist));return sf.value==='artist-asc'?A:sf.value==='artist-desc'?-A:sf.value==='song-asc'?S:-S});return a}function renderChips(){const a=[];if(artistFilter)a.push(`<button class="chip" data-clear="artist">Artist: ${esc(artistFilter)} ×</button>`);if(activeTuning())a.push(`<button class="chip tuning-chip" data-clear="tuning">Tuning: ${esc(activeTuning())} ×</button>`);if(q.value.trim())a.push(`<button class="chip" data-clear="search">Search: ${esc(q.value.trim())} ×</button>`);$('#chips').innerHTML=a.join('')}function updateLoadMore(total){const shouldShow=mode==='songs'&&total>visible;more.hidden=!shouldShow;more.style.display=shouldShow?'block':'none'}function render(){const a=filtered(),selected=activeTuning();document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===mode));if(mode==='songs'){grid.style.display='grid';dir.classList.remove('show');grid.innerHTML=a.slice(0,visible).map(s=>`<article class="card"><button class="artist" data-artist="${esc(s.artist)}">${esc(s.artist)}</button><div class="title">${esc(s.title)}</div><div class="badges">${String(s.tuning).split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<button class="pill tuning ${selected===x?'active':''}" data-tuning="${esc(x)}">${esc(x)}</button>`).join('')}<a class="pill ${s.hasLyrics?'lyrics':'nolyrics'}" href="${lyrics(s)}" target="_blank" rel="noopener">${s.hasLyrics?'Lyrics ↗':'Find Lyrics ↗'}</a></div></article>`).join('')||'<div class="empty">No matching songs.</div>';updateLoadMore(a.length);results.textContent=`Showing ${fmt(Math.min(visible,a.length))} of ${fmt(a.length)} songs`}else{const counts=new Map();a.forEach(s=>{if(mode==='artists')counts.set(s.artist,(counts.get(s.artist)||0)+1);else String(s.tuning).split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>counts.set(t,(counts.get(t)||0)+1))});const items=[...counts].sort((x,y)=>sf.value==='count-asc'?x[1]-y[1]||x[0].localeCompare(y[0]):sf.value==='count-desc'?y[1]-x[1]||x[0].localeCompare(y[0]):sf.value==='name-desc'?y[0].localeCompare(x[0]):x[0].localeCompare(y[0]));grid.style.display='none';dir.classList.add('show');dir.innerHTML=items.map(([name,count])=>`<button class="dircard" data-directory-${mode==='artists'?'artist':'tuning'}="${esc(name)}"><span class="arrow">→</span><strong>${esc(name)}</strong><span>${fmt(count)} ${count===1?'song':'songs'}</span></button>`).join('')||'<div class="empty">No matching results.</div>';updateLoadMore(0);results.textContent=`${fmt(items.length)} ${mode}`}renderChips()}function changeMode(next){const changed=mode!==next;mode=next;visible=PAGE;if(changed)updateSortOptions(next);render();if(innerWidth<=820)$('#sidebar').classList.remove('open')}function timestamp(v){const d=new Date(v);return isNaN(d)?'':`Updated ${d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} • ${d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`}async function load(){try{const d=await(await fetch(API,{cache:'no-store'})).json();songs=d.songs||[];updatedAt=d.updatedAt||d.generatedAt||'';const ac=new Set(songs.map(s=>s.artist)).size,tc=allTunings().length;[['songCount',songs.length],['artistCount',ac],['tuningCount',tc],['sideSongs',songs.length],['sideArtists',ac],['sideTunings',tc]].forEach(([id,v])=>$('#'+id).textContent=fmt(v));if(updatedAt)$('#updated').textContent=timestamp(updatedAt);tf.innerHTML='<option value="">All Tunings</option>'+allTunings().map(x=>`<option>${esc(x)}</option>`).join('');render()}catch(err){results.textContent='Songbook unavailable.'}}q.oninput=()=>{artistFilter='';visible=PAGE;render()};tf.onchange=()=>{tuningFilter=tf.value;visible=PAGE;changeMode('songs')};sf.onchange=render;$('#reset').onclick=()=>{q.value='';tf.value='';tuningFilter='';artistFilter='';mode='';changeMode('songs')};more.onclick=()=>{visible+=PAGE;render()};document.addEventListener('click',ev=>{const modeButton=ev.target.closest('[data-mode]');if(modeButton){changeMode(modeButton.dataset.mode);return}const viewButton=ev.target.closest('[data-view]');if(viewButton){changeMode(viewButton.dataset.view);return}const artist=ev.target.closest('[data-artist],[data-directory-artist]');if(artist){artistFilter=artist.dataset.artist||artist.dataset.directoryArtist;changeMode('songs');return}const tuning=ev.target.closest('[data-tuning],[data-directory-tuning]');if(tuning){const chosen=tuning.dataset.tuning||tuning.dataset.directoryTuning;tuningFilter=activeTuning()===chosen?'':chosen;tf.value=tuningFilter;changeMode('songs');return}const clear=ev.target.closest('[data-clear]');if(clear){if(clear.dataset.clear==='artist')artistFilter='';if(clear.dataset.clear==='tuning'){tuningFilter='';tf.value=''}if(clear.dataset.clear==='search')q.value='';render()}});$('#hamb').onclick=()=>$('#sidebar').classList.toggle('open');addEventListener('scroll',()=>$('#topButton').classList.toggle('show',scrollY>450),{passive:true});$('#topButton').onclick=()=>scrollTo({top:0,behavior:'smooth'});updateSortOptions('songs');load();
;function loadRequestStats(){var cb='songbookReqStats_'+Date.now(),sc=document.createElement('script');window[cb]=function(d){try{if(d&&d.stats){document.getElementById('requestPending').textContent=d.stats.requested;document.getElementById('requestAdded').textContent=d.stats.added;}}finally{try{delete window[cb];}catch(e){}if(sc.parentNode)sc.parentNode.removeChild(sc);}};var p=new URLSearchParams({action:'getRequests',callback:cb,_:Date.now()});sc.src=API+'?'+p.toString();document.body.appendChild(sc);}loadRequestStats();</script></body></html>
