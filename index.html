const API='https://script.google.com/macros/s/AKfycbx5EPKuoSLjsOj94G1Dufnq1PzZwuNo0cMUQ8ZMMns9fbKO67HFDgHr0zu7lkAAWOPI/exec',PAGE=60,$=s=>document.querySelector(s),q=$('#q'),tf=$('#tun'),sf=$('#sort'),grid=$('#grid'),dir=$('#directory'),more=$('#more'),results=$('#results');let songs=[],visible=PAGE,artistFilter='',tuningFilter='',instrumentFilters=new Set(),mode='songs',updatedAt='';const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),lyrics=s=>'https://www.google.com/search?'+new URLSearchParams({q:`${s.artist} ${s.title} lyrics`}),fmt=x=>Number(x).toLocaleString();function tuningCounts(){const counts=new Map();songs.forEach(s=>String(s.tuning||'Unknown Tuning').split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>counts.set(t,(counts.get(t)||0)+1)));return[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}function allTunings(){return tuningCounts().map(([name])=>name)}function activeTuning(){return tuningFilter||tf.value}function arrangementTunings(s,type){return s.arrangements&&Array.isArray(s.arrangements[type])?s.arrangements[type]:[]}function hasArrangement(s,type){return arrangementTunings(s,type).length>0}function arrangementLabel(type){return type.charAt(0).toUpperCase()+type.slice(1)}function updateSortOptions(nextMode=mode){const current=sf.value;const options=nextMode==='songs'?[['song-asc','Song A–Z'],['song-desc','Song Z–A'],['artist-asc','Artist A–Z'],['artist-desc','Artist Z–A']]:nextMode==='artists'?[['name-asc','Artist A–Z'],['name-desc','Artist Z–A'],['count-desc','Count ↓'],['count-asc','Count ↑']]:[['count-desc','Count ↓'],['count-asc','Count ↑'],['name-asc','Tuning A–Z'],['name-desc','Tuning Z–A']];sf.innerHTML=options.map(([value,label])=>`<option value="${value}">${label}</option>`).join('');const defaultValue=nextMode==='songs'?'song-asc':nextMode==='artists'?'name-asc':'count-desc';s
